name: Keepalive

# Holds the free Render instance awake through the day.
#
# The instance hibernates after 15 minutes idle and takes ~50s to wake, longer than the 30s ceiling
# of every free uptime pinger. Worse, Render cancels a wake whose client disconnects, so a pinger
# that gives up early never wakes anything and gets itself auto-disabled by its own failures. This
# job waits as long as it takes, so it can be the one to wake the instance as well as hold it.
#
# GitHub delays scheduled runs (minutes, sometimes more): a gap over 15 minutes costs one cold wake,
# which the next run absorbs. Render free grants 750 instance-hours a month; this window spends
# roughly 540 of them. Scheduled workflows are disabled after 60 days without a commit.
on:
  schedule:
    # Every 10 minutes from 06:00 to 23:59 in Sao Paulo (UTC-3), split because cron cannot wrap
    # midnight in one range.
    - cron: '*/10 9-23 * * *'
    - cron: '*/10 0-2 * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    env:
      HEALTH_URL: https://rpgforce-ai.onrender.com/health
    steps:
      - name: Ping the API
        run: |
          for attempt in 1 2 3; do
            # `Accept` must never include text/html: Render answers a request for a hibernating
            # service with a 258 KB "waking up" page instead of holding the connection open.
            result=$(curl -sS -o /dev/null -w '%{http_code} %{time_total}' \
              --max-time 120 \
              -H 'Accept: application/json' \
              "$HEALTH_URL" || echo '000 0')
            code=${result% *}
            echo "attempt $attempt: HTTP $code in ${result#* }s"

            if [ "$code" = "200" ]; then
              exit 0
            fi

            sleep 30
          done

          echo "The API did not answer. It is down, or Render refused to route to it."
          exit 1
